<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 56" width="256" height="56" fill="none">
  <defs>
    <!-- Brand Primary Gradient -->
    <linearGradient id="hdcTealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006d80" />
      <stop offset="45%" stop-color="#008fa7" />
      <stop offset="100%" stop-color="#00b4d8" />
    </linearGradient>

    <!-- Subtle Accent Line Gradient -->
    <linearGradient id="hdcLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#008fa7" />
      <stop offset="60%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#00b4d8" stop-opacity="0" />
    </linearGradient>

    <!-- Emblem Drop Shadow -->
    <filter id="emblemGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#005d6e" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- ==========================================
       1. EMBLEM (46x46 Monogram Badge)
       ========================================== -->
  <g transform="translate(4, 5)" filter="url(#emblemGlow)">
    <!-- Badge Background with smooth rounded corners -->
    <rect x="0" y="0" width="46" height="46" rx="12" fill="url(#hdcTealGrad)" />

    <!-- Inner subtle border -->
    <rect x="1" y="1" width="44" height="44" rx="11" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1" />

    <!-- Stylized Monogram: H - D - C -->
    <!-- H left bar -->
    <rect x="9.5" y="11" width="4.5" height="24" rx="2.25" fill="#ffffff" />
    
    <!-- H crossbar connecting to D -->
    <rect x="9.5" y="21" width="13" height="4" rx="2" fill="#ffffff" />
    
    <!-- D vertical stem -->
    <rect x="18" y="11" width="4.5" height="24" rx="2.25" fill="#ffffff" />
    
    <!-- D bold outer curve -->
    <path d="M20 11.5 H26.5 C32.5 11.5 35.5 16.5 35.5 23 C35.5 29.5 32.5 34.5 26.5 34.5 H20" 
          stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- C interlocking outer arc -->
    <path d="M33.5 15.5 C36 18 37.5 20.5 37.5 23 C37.5 25.5 36 28 33.5 30.5" 
          stroke="#e0f7fa" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Sparkle Diamond Accent on top-right corner of badge -->
    <path d="M36 6 L37.2 9.5 L40.5 10.7 L37.2 11.9 L36 15.4 L34.8 11.9 L31.5 10.7 L34.8 9.5 Z" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- ==========================================
       2. TYPOGRAPHY & WORDMARK
       ========================================== -->
  <g transform="translate(62, 0)">
    <!-- Primary HDC text -->
    <text x="0" y="29" font-family="'Inter Tight', 'Montserrat', 'Segoe UI', system-ui, sans-serif" font-size="25" font-weight="900" letter-spacing="1.5" fill="#072832">
      HDC
    </text>

    <!-- Refined Divider Dot -->
    <circle cx="61.5" cy="21.5" r="2.5" fill="url(#hdcTealGrad)" />

    <!-- FASHION luxury wordmark -->
    <text x="69" y="29" font-family="'Inter Tight', 'Montserrat', 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="700" letter-spacing="3.2" fill="url(#hdcTealGrad)">
      FASHION
    </text>

    <!-- Tagline: Phong Cách Tạo Thành Công -->
    <text x="0.5" y="44" font-family="'Inter Tight', 'Segoe UI', system-ui, sans-serif" font-size="8.5" font-weight="600" letter-spacing="1.6" fill="#64748b">
      PHONG CÁCH TẠO THÀNH CÔNG
    </text>

    <!-- Accent Underline -->
    <rect x="0.5" y="48.5" width="186" height="1.5" rx="0.75" fill="url(#hdcLineGrad)" />
  </g>
</svg>
